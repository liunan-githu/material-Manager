<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>素材台 · 本地素材库</title>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2366ccff'/%3E%3Crect x='7' y='9' width='18' height='14' rx='3.6' fill='%23ffffff'/%3E%3Cpath d='M14 13.1 19.8 16 14 18.9z' fill='%230a3a52'/%3E%3C/svg%3E">
<script>
  /* 启动异常兜底：出错时在页面上留个痕迹，方便排查空白页 */
  window.__bootErrors = [];
  function reportBootError(message) {
    window.__bootErrors.push(String(message));
    document.documentElement.setAttribute('data-boot-error', window.__bootErrors.join(' || '));
  }
  window.addEventListener('error', function (event) {
    if (event.target && event.target.tagName === 'SCRIPT') return;
    reportBootError((event.message || 'error') + ' @ ' + (event.filename || '') + ':' + (event.lineno || 0));
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    reportBootError('rejection: ' + ((reason && reason.message) || reason));
  });
</script>
</head>
<body>

<!-- 图标精灵 -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.6 0 1.2.3 1.6.8L11.5 7h7A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 8V6.5A2.5 2.5 0 0 1 5.5 4h3.2c.6 0 1.2.3 1.6.8L11.5 6h6A2.5 2.5 0 0 1 20 8.5V9"/><path d="M3.6 10h16.9a1 1 0 0 1 1 1.2l-1.3 6a2 2 0 0 1-2 1.8H5.7a2 2 0 0 1-2-1.6L2.6 11.2A1 1 0 0 1 3.6 10Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="4.6" cy="18" r="1.1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.5V4.5M7.8 8.7 12 4.5l4.2 4.2"/><path d="M4 15.5v2.2A2.3 2.3 0 0 0 6.3 20h11.4a2.3 2.3 0 0 0 2.3-2.3v-2.2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="8.5" cy="17" r="2.2"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M20.3 13.1 12.9 20.5a2 2 0 0 1-2.8 0L3 13.4V3.2h10.2l7.1 7.1a2 2 0 0 1 0 2.8Z"/><circle cx="8.2" cy="8.2" r="1.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 10l5.9-.8z"/></symbol>
    <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="m12 3.8 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 10l5.9-.8z" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7M6.4 7l.9 12.2h9.4L17.6 7"/><path d="M10.5 11v5M13.5 11v5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.4 19 12 8.5 18.6z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="7.5" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.1" y="5" width="3.4" height="14" rx="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m5 17 4.5-4.5L13 16l2.5-2.4L20 18"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.4"/><path d="M8 5v14M16 5v14M3.5 10h4.5M3.5 14h4.5M16 10h4.5M16 14h4.5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17.5V6l9-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="15.5" cy="15.5" r="2.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13.5 3.5H7A2.5 2.5 0 0 0 4.5 6v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9.5Z"/><path d="M13.5 3.5v6h6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.8 10.8 12 15l4.2-4.2"/><path d="M4 16.5v1.2A2.3 2.3 0 0 0 6.3 20h11.4a2.3 2.3 0 0 0 2.3-2.3v-1.2"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19 5l-7.5 7.5"/><path d="M18 14v4.5A2.5 2.5 0 0 1 15.5 21h-9A2.5 2.5 0 0 1 4 18.5v-9A2.5 2.5 0 0 1 6.5 7H11"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.2 21 19.5H3z"/><path d="M12 9.8v4.4M12 17v.2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16z"/><path d="m14.5 5.5 4 4"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2c.6 0 1.2.3 1.6.8L11.5 7h7A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M9.5 12.5h5M12.2 10l2.3 2.5-2.3 2.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4h4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3.8 8 4.3-8 4.3-8-4.3z"/><path d="m4 12.2 8 4.3 8-4.3M4 16.4l8 4.3 8-4.3"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="10" fill="var(--accent)"/><rect x="7" y="9" width="18" height="14" rx="3.6" fill="#ffffff" opacity="0.96"/><path d="M14 13.1 19.8 16 14 18.9z" fill="#0a3a52"/></svg>
      </span>
      <span class="brand__text">
        <strong>素材台</strong>
        <span>本地素材库</span>
      </span>
    </div>

    <nav class="nav" id="nav">
      <a class="nav__item" href="#/all" data-view="all">
        <svg class="ico"><use href="#i-layers"/></svg>
        <span class="nav__label">全部素材</span>
        <span class="nav__count" data-count="all">0</span>
      </a>
      <a class="nav__item" href="#/favorite" data-view="favorite">
        <svg class="ico"><use href="#i-star"/></svg>
        <span class="nav__label">收藏</span>
        <span class="nav__count" data-count="favorite">0</span>
      </a>
      <a class="nav__item" href="#/trash" data-view="trash">
        <svg class="ico"><use href="#i-trash"/></svg>
        <span class="nav__label">回收站</span>
        <span class="nav__count" data-count="trash">0</span>
      </a>
    </nav>

    <div class="sidebar__scroll">
      <section class="block">
        <header class="block__head">
          <span>分类</span>
          <button class="mini-btn" data-action="new-folder" title="新建分类">
            <svg class="ico"><use href="#i-plus"/></svg>
          </button>
        </header>
        <div class="tree" id="tree"></div>
      </section>

      <section class="block block--tags">
        <header class="block__head">
          <span>标签</span>
          <button class="mini-btn" data-action="new-tag" title="新建标签">
            <svg class="ico"><use href="#i-plus"/></svg>
          </button>
        </header>
        <div class="taglist" id="taglist"></div>
      </section>
    </div>

    <footer class="sidebar__foot">
      <div class="meter">
        <div class="meter__row">
          <span>素材占用</span>
          <strong id="statBytes">0 B</strong>
        </div>
        <div class="meter__track" id="storageTrack"></div>
        <div class="meter__hint">
          <span id="statCount">0 个素材</span>
          <span class="ffmpeg-dot" id="ffmpegState" title="FFmpeg 状态"><i></i>检测中</span>
        </div>
      </div>
    </footer>
  </aside>

  <main class="stage">
    <header class="topbar">
      <button class="icon-btn topbar__menu" data-action="toggle-sidebar" title="收起分类栏">
        <svg class="ico"><use href="#i-menu"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="路径"></nav>

      <div class="topbar__tools">
        <label class="search" id="searchBox">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="搜索名称、标签、备注" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>

        <div class="segmented" id="viewToggle" role="group" aria-label="视图">
          <button data-view="grid" class="is-active" title="网格视图" aria-label="网格视图">
            <svg class="ico"><use href="#i-grid"/></svg>
          </button>
          <button data-view="list" title="列表视图" aria-label="列表视图">
            <svg class="ico"><use href="#i-list"/></svg>
          </button>
        </div>

        <button class="btn btn--primary" data-action="upload">
          <svg class="ico"><use href="#i-upload"/></svg>
          <span>上传素材</span>
        </button>

        <button class="icon-btn" data-action="settings" title="设置">
          <svg class="ico"><use href="#i-sliders"/></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="content__head">
        <div class="chips" id="kindChips" role="tablist" aria-label="类型筛选">
          <button class="chip is-active" data-kind="all" role="tab">全部</button>
          <button class="chip" data-kind="video" role="tab"><svg class="ico"><use href="#i-film"/></svg>视频</button>
          <button class="chip" data-kind="audio" role="tab"><svg class="ico"><use href="#i-music"/></svg>音频</button>
          <button class="chip" data-kind="image" role="tab"><svg class="ico"><use href="#i-image"/></svg>图片</button>
          <button class="chip" data-kind="other" role="tab"><svg class="ico"><use href="#i-file"/></svg>其他</button>
        </div>

        <div class="content__meta">
          <span class="result-count" id="resultCount"></span>
          <label class="select">
            <select id="sort" aria-label="排序">
              <option value="recent">最新导入</option>
              <option value="oldest">最早导入</option>
              <option value="name">名称 A-Z</option>
              <option value="size">体积从大到小</option>
              <option value="duration">时长从长到短</option>
            </select>
            <svg class="ico select__caret"><use href="#i-chevron-down"/></svg>
          </label>
        </div>
      </div>

      <div class="scroller" id="scroller">
        <div class="board" id="board" aria-live="polite" aria-busy="false"></div>
      </div>
    </div>
  </main>

  <aside class="inspector" id="inspector" aria-hidden="true">
    <header class="inspector__head">
      <span class="inspector__title">素材信息</span>
      <button class="icon-btn" data-action="close-inspector" title="收起">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="inspector__body" id="inspectorBody"></div>
    <div class="inspector__foot" id="inspectorFoot" hidden></div>
  </aside>
</div>

<!-- 多选操作条 -->
<div class="selectionbar" id="selectionBar" hidden>
  <span class="selectionbar__count"><strong id="selCount">0</strong> 项已选</span>
  <span class="selectionbar__sep"></span>
  <button class="ghost-btn" data-sel="move"><svg class="ico"><use href="#i-move"/></svg>移动</button>
  <button class="ghost-btn" data-sel="tag"><svg class="ico"><use href="#i-tag"/></svg>标签</button>
  <button class="ghost-btn" data-sel="favorite"><svg class="ico"><use href="#i-star"/></svg>收藏</button>
  <button class="ghost-btn ghost-btn--danger" data-sel="trash"><svg class="ico"><use href="#i-trash"/></svg>删除</button>
  <span class="selectionbar__sep"></span>
  <button class="ghost-btn ghost-btn--quiet" data-sel="clear">取消</button>
</div>

<!-- 上传队列 -->
<div class="uploader" id="uploader" hidden>
  <header class="uploader__head">
    <div class="uploader__title">
      <strong id="uploadTitle">正在上传</strong>
      <span id="uploadSub"></span>
    </div>
    <div class="uploader__tools">
      <button class="mini-btn" data-action="toggle-uploader" title="收起">
        <svg class="ico"><use href="#i-chevron-down"/></svg>
      </button>
      <button class="mini-btn" data-action="clear-uploader" title="清除已完成">
        <svg class="ico"><use href="#i-close"/></svg>
      </button>
    </div>
  </header>
  <div class="uploader__list" id="uploadList"></div>
</div>

<!-- 预览 -->
<div class="modal modal--preview" id="previewModal" hidden>
  <div class="modal__scrim" data-close="preview"></div>
  <div class="viewer" role="dialog" aria-modal="true" aria-label="预览">
    <header class="viewer__head">
      <div class="viewer__name">
        <strong id="previewTitle"></strong>
        <span id="previewPath"></span>
      </div>
      <div class="viewer__tools">
        <button class="ghost-btn" data-preview="favorite"><svg class="ico"><use href="#i-star"/></svg><span>收藏</span></button>
        <button class="ghost-btn" data-preview="proxy"><svg class="ico"><use href="#i-refresh"/></svg><span id="proxyLabel">代理</span></button>
        <a class="ghost-btn" id="previewDownload" href="#" download><svg class="ico"><use href="#i-download"/></svg><span>下载</span></a>
        <button class="icon-btn" data-close="preview" title="关闭（Esc）"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
    </header>
    <div class="viewer__stage" id="previewStage"></div>
    <footer class="viewer__foot">
      <button class="icon-btn" id="previewPrev" title="上一个（←）"><svg class="ico"><use href="#i-arrow-left"/></svg></button>
      <div class="viewer__meta" id="previewMeta"></div>
      <button class="icon-btn" id="previewNext" title="下一个（→）"><svg class="ico"><use href="#i-arrow-right"/></svg></button>
      <span class="viewer__counter" id="previewCounter"></span>
    </footer>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal__scrim" data-close="settings"></div>
  <div class="dialog dialog--wide" role="dialog" aria-modal="true" aria-label="设置">
    <header class="dialog__head">
      <h2>设置</h2>
      <button class="icon-btn" data-close="settings"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div class="dialog__body" id="settingsBody"></div>
    <footer class="dialog__foot">
      <span class="dialog__hint" id="settingsHint"></span>
      <button class="btn btn--primary" data-action="save-settings">保存</button>
    </footer>
  </div>
</div>

<!-- 通用对话框 -->
<div class="modal" id="dialogModal" hidden>
  <div class="modal__scrim" data-close="dialog"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <header class="dialog__head">
      <h2 id="dialogTitle">标题</h2>
      <button class="icon-btn" data-close="dialog"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div class="dialog__body" id="dialogBody"></div>
    <footer class="dialog__foot" id="dialogActions"></footer>
  </div>
</div>

<!-- 拖放遮罩 -->
<div class="dropzone-overlay" id="dropOverlay" hidden>
  <div class="dropzone">
    <svg class="ico"><use href="#i-upload"/></svg>
    <strong>松手加入素材库</strong>
    <span id="dropTarget">将存入「全部素材」</span>
  </div>
</div>

<div class="menu" id="contextMenu" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filePicker" multiple hidden>
<input type="file" id="folderPicker" webkitdirectory directory multiple hidden>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
